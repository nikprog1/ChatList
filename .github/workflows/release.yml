name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Запускается при создании тега версии

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Get version from version.py
      id: get_version
      run: |
        python -c "from version import __version__; print(f'VERSION={__version__}')" >> $env:GITHUB_OUTPUT
      shell: powershell
      
    - name: Build EXE
      run: |
        pyinstaller MinimalProgram.spec --clean --noconfirm
      shell: powershell
      
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: ChatList ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## ChatList ${{ steps.get_version.outputs.VERSION }}
          
          См. [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) для полного списка изменений.
          
          ### Скачать
          - **ChatList-${{ steps.get_version.outputs.VERSION }}.exe** - Портативная версия (не требует установки)
        draft: false
        prerelease: false
        
    - name: Upload EXE to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/ChatList-${{ steps.get_version.outputs.VERSION }}.exe
        asset_name: ChatList-${{ steps.get_version.outputs.VERSION }}.exe
        asset_content_type: application/octet-stream
