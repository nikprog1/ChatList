name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Запускается при создании тега версии (например, v1.0.0)

permissions:
  contents: write  # Необходимо для создания релиза

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Get version from version.py
      id: get_version
      run: |
        python -c "from version import __version__; print(f'VERSION={__version__}')" >> $env:GITHUB_OUTPUT
      shell: powershell
      
    - name: Build EXE
      run: |
        pyinstaller MinimalProgram.spec --clean --noconfirm
      shell: powershell
      
    - name: Verify EXE exists
      run: |
        if (Test-Path "dist\ChatList-${{ steps.get_version.outputs.VERSION }}.exe") {
          Write-Host "✓ EXE файл создан успешно"
          Get-Item "dist\ChatList-${{ steps.get_version.outputs.VERSION }}.exe" | Select-Object Name, Length
        } else {
          Write-Host "✗ EXE файл не найден!"
          exit 1
        }
      shell: powershell
      
    - name: Extract tag name
      id: tag
      run: |
        $tag = "${{ github.ref }}".Replace("refs/tags/", "")
        echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        Write-Host "Tag: $tag"
      shell: powershell
      
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.TAG }}
        name: ChatList ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## ChatList ${{ steps.get_version.outputs.VERSION }}
          
          См. [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) для полного списка изменений.
          
          ### Скачать
          - **ChatList-${{ steps.get_version.outputs.VERSION }}.exe** - Портативная версия (не требует установки)
        draft: false
        prerelease: false
        files: |
          dist/ChatList-${{ steps.get_version.outputs.VERSION }}.exe
        token: ${{ secrets.GITHUB_TOKEN }}
